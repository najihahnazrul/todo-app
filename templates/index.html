<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <link rel="stylesheet" href="/static/style.css?v=4">
</head>

<body>

    <main class="todo-container">
        <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"><span class="theme-icon">🌙</span></button>


        <h1>My To-Do List</h1>
        <p class="subtitle">Keep track of your daily tasks.</p>

        <div class="action-tabs">
    <button class="action-tab" id="addTab">
        + Add new task
    </button>

    <button class="action-tab" id="searchTab">
        🔍 Search
    </button>
</div>

<div class="panel-stage" id="panelStage">
    <div class="panel-flipper" id="panelFlipper">

        <div class="panel-face panel-front" id="addPanel">
            <div class="task-form">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task"
                >

                <button id="addButton">Add Task</button>
            </div>
        </div>

        <div class="panel-face panel-back" id="searchPanel">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >
            </div>
        </div>

    </div>
</div>

<ul id="taskList"></ul>

    </main>

    <script src="/static/script.js?v=2"></script>

</body>

</html>
